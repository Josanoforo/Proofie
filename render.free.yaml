        value: "true"
      - key: COPILOT_FEATURE_ACTIVE_APPROVAL
        value: "true"
      - key: COPILOT_FEATURE_SELLER_SHORTCUTS
        value: "true"
      - key: COPILOT_FEATURE_CARRIER_REQUIRED
        value: "true"
