# Blueprint of the optional hosted demo: Render free plan, no disk, one worker, automatic deploys off. Data is cleared on restart, redeploy or idle sleep.
# Creating a service from it needs the owner's approval.
services:
  - type: web
    name: proofie-sandbox-demo
    runtime: python
    buildCommand: pip install --require-hashes -r requirements.lock.linux.hashes.txt
    startCommand: python -m uvicorn copilot.hosted_ephemeral:create_app --factory --host 0.0.0.0 --port "$PORT" --proxy-headers --forwarded-allow-ips="*" --workers 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: COPILOT_HOSTED_DEMO
        value: "true"
      - key: COPILOT_ACCESS_CODE
        sync: false
      - key: COPILOT_DATA_DIR
        value: /tmp/proofie-demo
      - key: COPILOT_EPHEMERAL_ROOT
        value: /tmp/proofie-demo
      - key: PROOFIE_EVIDENCE_DIR
        value: /tmp/proofie-demo/evidence
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: COPILOT_WEBHOOK_ID
        sync: false
      - key: COPILOT_FEATURE_ACCOUNT_CLIFF
        value: "true"
