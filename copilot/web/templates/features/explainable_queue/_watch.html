{# D-101 r2 (R2-D): the seller can have the inbox look for a case that has just been opened. Opt-in: the box is never ticked for them. #}
<p class="inbox-watch" data-state="inbox-watch" data-seen="{{ rows|map(attribute='norm.dispute_id')|join(',') }}" data-url="/inbox/watch" data-interval="15" data-max="40">
<label><input type="checkbox" id="inbox-watch-toggle"> Watch for new cases</label> <span id="inbox-watch-status" role="status" aria-live="polite">Tick the box and this page checks PayPal every 15 seconds for a new case.</span></p>
