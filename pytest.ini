[pytest]
markers =
    sandbox: hits the real PayPal sandbox (network). Never run by default - see tests/sandbox/README.md.
            Run explicitly with: pytest -m sandbox tests/sandbox
    live_model: hits a real local Ollama (network, needs the GPU free and a local Ollama).
            Never run by default, same as sandbox. Run explicitly with: pytest -m live_model
    pool_scope: the hosted demo keeps its bound to the judge pool and the record case (conftest.py turns it off for other tests).
    capture: regenerates a lane's record screenshots under internal/lanes (writes tracked PNGs, needs Playwright Chromium).
            Never run by default. Run explicitly with: pytest -m capture internal/lanes
addopts = -m "not sandbox and not live_model and not capture"
norecursedirs = scratch-* *.egg .* _darcs build CVS dist node_modules venv {arch}

# Bound a stalled offline test without changing its assertions.
timeout = 600
timeout_method = thread
